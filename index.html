<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">

  <meta name="theme-color" content="#141e30">
</head>

<body>

  <div class="container">

    <h1 class="title">Expense Tracker</h1>

    <div class="tabs">

      <button
        class="tab-btn active"
        onclick="showTab('addTab', this)"
      >
        Add Entry
      </button>

      <button
        class="tab-btn"
        onclick="showTab('historyTab', this)"
      >
        History
      </button>

    </div>

    <!-- ADD TAB -->
    <div id="addTab" class="tab-content">

      <div class="summary-grid">

        <div class="summary-box credit-box">
          <h3>Today's Credit</h3>
          <p id="todayCredit">₹0</p>
        </div>

        <div class="summary-box debit-box">
          <h3>Today's Debit</h3>
          <p id="todayDebit">₹0</p>
        </div>

        <div class="summary-box credit-box">
          <h3>Monthly Credit</h3>
          <p id="monthCredit">₹0</p>
        </div>

        <div class="summary-box debit-box">
          <h3>Monthly Debit</h3>
          <p id="monthDebit">₹0</p>
        </div>

      </div>

      <div class="card">

        <h2>Add Entry</h2>

        <input type="date" id="date">

        <select id="type">
          <option value="Credit">Credit</option>
          <option value="Debit">Debit</option>
        </select>

        <input
          type="number"
          id="amount"
          placeholder="Enter Amount"
        >

        <textarea
          id="comment"
          placeholder="Comment"
        ></textarea>

        <button onclick="addEntry()">
          Save Entry
        </button>

      </div>

      <div class="card">

        <h2>All Entries</h2>

        <div class="table-container">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Comment</th>
                <th>Delete</th>
              </tr>
            </thead>

            <tbody id="latestEntriesTable"></tbody>

          </table>

        </div>

      </div>

    </div>

    <!-- HISTORY TAB -->
    <div id="historyTab" class="tab-content hidden">

      <div class="card">

        <h2>Search Entries</h2>

        <label>From Date</label>
        <input type="date" id="fromDate">

        <label>To Date</label>
        <input type="date" id="toDate">

        <button onclick="filterEntries()">
          Search
        </button>

      </div>

      <div class="summary-grid">

        <div class="summary-box credit-box">
          <h3>Total Credit</h3>
          <p id="filterCredit">₹0</p>
        </div>

        <div class="summary-box debit-box">
          <h3>Total Debit</h3>
          <p id="filterDebit">₹0</p>
        </div>

      </div>

      <div class="card">

        <h2>Filtered Entries</h2>

        <div class="table-container">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Comment</th>
                <th>Delete</th>
              </tr>
            </thead>

            <tbody id="entriesTable"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
