<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Expense Tracker</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container">

    <h1 class="title">Expense Tracker</h1>

    <!-- TOP SUMMARY -->
    <div class="summary-grid">

      <div class="summary-box credit-box">
        <h3>Today's Credit</h3>
        <p id="todayCredit">₹0</p>
      </div>

      <div class="summary-box debit-box">
        <h3>Today's Debit</h3>
        <p id="todayDebit">₹0</p>
      </div>

      <div class="summary-box credit-box">
        <h3>Monthly Credit</h3>
        <p id="monthCredit">₹0</p>
      </div>

      <div class="summary-box debit-box">
        <h3>Monthly Debit</h3>
        <p id="monthDebit">₹0</p>
      </div>

    </div>

    <!-- ADD ENTRY -->
    <div class="card">

      <h2>Add Entry</h2>

      <input type="date" id="date">

      <select id="type">
        <option value="Credit">Credit</option>
        <option value="Debit">Debit</option>
      </select>

      <input type="number" id="amount" placeholder="Enter Amount">

      <textarea id="comment" placeholder="Comment"></textarea>

      <button onclick="addEntry()">
        Save Entry
      </button>

    </div>

    <!-- FILTER -->
    <div class="card">

      <h2>Filter Entries</h2>

      <label>From Date</label>
      <input type="date" id="fromDate">

      <label>To Date</label>
      <input type="date" id="toDate">

      <button onclick="filterEntries()">
        Search
      </button>

    </div>

    <!-- FILTER SUMMARY -->
    <div class="summary-grid">

      <div class="summary-box credit-box">
        <h3>Total Credit</h3>
        <p id="filterCredit">₹0</p>
      </div>

      <div class="summary-box debit-box">
        <h3>Total Debit</h3>
        <p id="filterDebit">₹0</p>
      </div>

    </div>

    <!-- TABLE -->
    <div class="card">

      <h2>All Entries</h2>

      <div class="table-container">

        <table>

          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Comment</th>
              <th>Delete</th>
            </tr>
          </thead>

          <tbody id="entriesTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>

</html>
